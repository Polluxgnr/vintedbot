      - {key: iphone15, name: iPhone 15, match: ['iphone 15\b'], exclude: ['pro', 'plus'], resale: 470, new: 769}
      - {key: iphone15pro, name: iPhone 15 Pro, match: ['iphone 15 pro'], exclude: ['max'], resale: 640}
      - {key: iphone15promax, name: iPhone 15 Pro Max, match: ['iphone 15 pro max'], resale: 760}
      - {key: iphone14promax, name: iPhone 14 Pro Max, match: ['iphone 14 pro max'], resale: 580}
