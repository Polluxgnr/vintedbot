  consoles:
    feed_catalogs: [3025]
    vinted_verification: electronics
    verification_min_price: 50
    name: "Consoles récentes"
    emoji: "🎮"
    description: "Switch, PS5, Steam Deck, Xbox - volume énorme, revente en 24h."
    enabled_by_default: true
    queries: [nintendo switch oled, nintendo switch 2, playstation 5, ps5 slim, steam deck oled, steam deck, xbox series x,
              nintendo switch lite, ps vita, meta quest 3, ps4 slim, ps4 pro, xbox series s]
    price_min: 40
    price_max: 550
    shipping_eur: 8
    min_profit: 30
    authenticity_risk: medium
    collectible: false
    model_guard:
      - '^(?!.*(?:console|consola|konsole|pack|bundle|\+|avec|with|\bcon\b|\bmit\b|incl\w*|complete?|\d+ ?(?:go|gb|to|tb)\b)).*\b(?:manettes?|controllers?|dualsense|dual sense|joy ?cons?|joystick|mando|mandos|comando|comandos|controle|kontroller|gamepad|volant|amiibo|jeux?|games?|juego|spiel|gioco|steelbook|cartouche|cartridge|collection|anniversary|aniversario|remaster\w*|deluxe|goty|dlc|season pass|portal|casque|headset|camera|remote|telecommande|lecteur seul|disc drive|disk drive|accessoires?)\b'
      - '^(?!.*(?:console|consola|konsole|pack|bundle|\+|avec|with|\bcon\b|\bmit\b|incl\w*|complete?|\d+ ?(?:go|gb|to|tb)\b)).*\b(?:housse|etui|sacoche|coque|carcasa|cover|faceplates?|facade|plaques?|cache|socle|stand|support|silicone|skin|alimentation|power supply|tampas?|tapas?|carcaca|stickers?|autocollants?|protection|ventilateur|ventola|refroidissement|cooler|cooling|station de charge|charging|chargeur|dock seul|boite vide|boite seule|empty box|caja vacia|scatola|gashapon|figurine|lego|3d ?print|rangement|presentoir|tapis|kit|decoration|custom)\b'
      - '\b(?:playstation portal|ps portal|portal remote)\b|\bportable\b.*\bps ?5\b|\bps ?5\b.*\bportable\b|\bportal\b.*\bps ?5\b|\bps ?5\b.*\bportal\b'
    game_guard:   # a game title rules out a console priced under half of its value
      - '^(?!.*(?:console|consola|konsole|pack|bundle|\+|avec|with|\bcon\b|\bmit\b|oled|\blite\b|slim|digital|numerique|\bpro\b|edition limitee|limited edition|\d+ ?(?:go|gb|to|tb)\b)).*\b(?:zelda|mario|pokemon|kirby|metroid|splatoon|smash|xenoblade|animal crossing|fifa|ea ?fc|call of duty|gta|grand theft|spider ?man|god of war|elden ring|hogwarts|baldur|cyberpunk|assassin|red dead|horizon|gran turismo|last of us|ratchet|astro bot|final fantasy|resident evil|minecraft|nba ?2k|forza|halo|starfield|diablo|mortal kombat|tekken|street fighter|sonic|lego|just dance|ghost of|uncharted|demon souls|returnal|stellar blade|black myth|monster hunter|dragon ball|naruto|one piece)\b'
    components: [{name: manettes/Joy-Con, match: 'joy ?cons?|manettes?|controllers?', share: 0.22}, {name: dock, match: 'dock|station|socle', share: 0.12}, {name: alimentation/câbles, match: 'chargeur|alimentation|cables?|hdmi|bloc secteur', share: 0.06}, {name: boîte, match: 'boite|carton', share: 0.03}]
    alone: [{match: 'console seule|console uniquement|uniquement la console|tablette seule|ecran seul|sans accessoires?|sans rien', missing: [manettes/Joy-Con, dock, alimentation/câbles]}]
    exclude: ['^(?!.*(?:console|consola|konsole|pack|bundle|\+|avec|with|\boled\b|\blite\b)).*\b(?:jeux?|juego|game|spiel|gioco|precinto|scelle)\b', '^jeux?\b', '\bjeu seul\b', '\bmanette seule\b', '^coque\b', '\bskin\b', '\bsupport\b', '\bstation de charge\b',
              '\bboite vide\b', '\bdock seul\b', '\bpochette\b']
    red_flags: [console bannie, joy-con drift, lecteur disque bruyant (PS5), console "reconditionnée" sans détail, numéro de série masqué]
    vision_checklist: [rayures écran, état joy-con/manettes, accessoires (dock, câbles), numéro de série, boîte]
    models:
      - {key: switch_oled, name: Switch OLED, match: ['switch oled'], resale: 220, new: 349, hardware: true}
      - {key: switch2, name: Switch 2, match: ['switch 2\b'], resale: 400, new: 469, hardware: true}
      - {key: switch_v2, name: Switch (standard), match: ['nintendo switch\b'], exclude: ['oled', 'lite', 'switch 2'], resale: 150, new: 299, hardware: true}
      - {key: switch_lite, name: Switch Lite, match: ['switch lite'], resale: 110, new: 219, hardware: true}
      - {key: ps5_pro, name: PS5 Pro, match: ['(?:ps ?5|playstation 5) ?pro\b'], resale: 560, new: 799, hardware: true}
      - {key: ps5_slim_digital, name: PS5 Slim Digital, match: ['(?:ps ?5|playstation 5).*slim.*(?:digital|numerique|digitale)|(?:ps ?5|playstation 5).*(?:digital|numerique|digitale).*slim'], resale: 300, new: 449, hardware: true}
      - {key: ps5_slim_disc, name: PS5 Slim lecteur, match: ['(?:ps ?5|playstation 5).*slim.*(?:lecteur|disque|disc|disk|standard|blu ?ray)|(?:ps ?5|playstation 5).*(?:lecteur|disque|disc|disk|standard|blu ?ray).*slim'], resale: 350, new: 549, hardware: true}
      - {key: ps5_slim, name: PS5 Slim (version à confirmer), match: ['(?:ps ?5|playstation 5).*slim'], exclude: ['(?:digital|numerique|digitale)', '(?:lecteur|disque|disc|disk|standard|blu ?ray)', '\bpro\b'], resale: 320, generic: true, hardware: true}
      - {key: ps5_digital, name: PS5 Digital (fat), match: ['(?:ps ?5|playstation 5).*(?:digital|numerique|digitale)'], exclude: ['slim', '\bpro\b'], resale: 250, hardware: true}
      - {key: ps5_disc, name: PS5 lecteur (fat), match: ['(?:ps ?5|playstation 5).*(?:lecteur|disque|disc|disk|standard|blu ?ray)'], exclude: ['slim', '\bpro\b', '(?:digital|numerique|digitale)'], resale: 300, hardware: true}
      - {key: ps5_unknown, name: PS5 (version à confirmer), match: ['\bps ?5\b|playstation 5'], exclude: ['slim', '\bpro\b', '(?:digital|numerique|digitale)', '(?:lecteur|disque|disc|disk|standard|blu ?ray)'], resale: 290, generic: true, hardware: true}
      - {key: steamdeck_oled, name: Steam Deck OLED, match: ['steam ?deck oled'], resale: 430, new: 569, hardware: true}
      - {key: steamdeck, name: Steam Deck LCD, match: ['steam ?deck'], exclude: ['oled'], resale: 280, hardware: true}
