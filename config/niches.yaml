    verification_min_price: 150
    name: "Outdoor premium"
    emoji: "🏔️"
    description: "Arc'teryx, The North Face, Patagonia - forte demande, vendeurs qui sous-estiment."
    enabled_by_default: true
    queries: [arcteryx, arc'teryx beta, arc'teryx atom, north face nuptse 1996, patagonia retro x, patagonia synchilla,
              patagonia better sweater, salomon veste gore-tex, mammut veste]
    price_max: 250
    shipping_eur: 6
    min_profit: 25
    authenticity_risk: high
    collectible: false
    model_guard:
      - '\b(?:junior|enfant|kids?|bambin[oa]|kinder|bebe)\b'
    components: [{name: capuche, match: 'capuche', share: 0.12}]
    alone: []
    exclude: ['\benfant\b', '\bkids\b', '\b(?:bonnet|beanie|berretto|gorro|mutze|muetze|toque|tuque|casquette|cap|hat|chapeau|cappello)\b',
              '\b(?:gants?|gloves?|handschuhe|guanti|chaussettes?|socks?|tour de cou|cache cou|neck gaiter|sac|bag|backpack|rucksack|sacoche|banane|ceinture|belt|porte cles|keychain)\b']
    red_flags: [étiquette intérieure absente (Arc'teryx a un code CR), logo brodé imprécis, prix < 35% de la cote]
    vision_checklist: [étiquettes intérieures et code produit, logo brodé, zips (YKK/Watertight), délaminage gore-tex, boulochage polaire]
    ai_hints: "Arc'teryx Beta/Alpha SV et Atom se revendent très vite. Les Nuptse 1996 700 sont souvent copiées."
    models:
      - {key: arc_beta, name: Arc'teryx Beta (LT/AR/SL), match: ['arc ?teryx.*\bbeta\b'], resale: 280, new: 500}
      - {key: arc_alpha, name: Arc'teryx Alpha SV/AR, match: ['arc ?teryx.*\balpha\b'], resale: 380, new: 800}
      - {key: arc_atom, name: Arc'teryx Atom, match: ['arc ?teryx.*\batom\b'], resale: 150, new: 300}
      - {key: arc_tee, name: Arc'teryx t-shirt, match: ['arc ?teryx.*(?:t ?shirt|\btee\b|long sleeve|manches longues)'], resale: 40, generic: true}
      - {key: arc_other, name: Arc'teryx veste/polaire (autre), match: ['arc ?teryx.*(?:veste|jacket|polaire|fleece|doudoune|softshell|hardshell|shell|pantalon|pants?|gilet|vest|hoodie|anorak|parka)'], resale: 110, generic: true}
      - {key: nuptse, name: TNF Nuptse 1996, match: ['nuptse'], resale: 150, new: 330}
      - {key: retrox, name: Patagonia Retro-X, match: ['retro ?x'], resale: 110, new: 220}
      - {key: synchilla, name: Patagonia Synchilla, match: ['synchilla'], resale: 60, new: 130}
      - {key: better_sweater, name: Patagonia Better Sweater, match: ['better sweater'], resale: 55, new: 150}
      - {key: moncler_maya, name: Moncler doudoune (Maya, Montclar...), match: ['moncler.*(?:doudoune|maya|montclar|jacket|veste)'], resale: 550}
      - {key: canada_goose, name: Canada Goose parka, match: ['canada goose'], resale: 450}
      - {key: tnf_himalayan, name: TNF Himalayan / 700 Retro, match: ['himalayan'], exclude: ['nuptse'], resale: 160}
      - {key: arc_gamma, name: Arc'teryx Gamma, match: ['arc ?teryx.*gamma'], resale: 180}
      - {key: salomon_veste, name: Salomon veste technique, match: ['salomon.*(?:veste|jacket|gore)'], resale: 80, generic: true}

  streetwear_designer:
    vinted_verification: authenticity
    verification_min_price: 100
    name: "Streetwear & designer"
    emoji: "🧥"
    description: "Stone Island, C.P. Company, Carhartt WIP, Ralph Lauren vintage, Lacoste."
    enabled_by_default: true
    queries: [stone island, cp company goggle, carhartt detroit jacket, carhartt wip veste, ralph lauren polo bear,
              ralph lauren quarter zip, lacoste vintage, burberry trench]
    price_max: 220
    shipping_eur: 5.5
    min_profit: 20
    authenticity_risk: high
    collectible: false
    model_guard:
      - '\b(?:junior|enfant|kids?|bambin[oa]|nin[oa]s?|kinder|bebe|patch|chaussettes?|socks?|calze)\b'
    components: [{name: badge, match: 'badge', share: 0.25}, {name: étiquettes, match: 'etiquettes?', share: 0.05}]
    alone: []
    exclude: ['\benfant\b', '\bkids\b', '\bbadge seul\b', '\bpatch\b seul']
    red_flags: [badge Stone Island sans boutons, pas de photo étiquette CERTILOGO/QR, prix < 30% de la cote]
    vision_checklist: [badge et boutons (Stone Island), étiquettes intérieures et lavage, lentilles goggle (CP), coutures, délavage]
    ai_hints: "Stone Island - vérifier badge, boutons et étiquettes. Carhartt Detroit vintage (made in USA) vaut bien plus que les rééditions."
    models:
      - {key: stone_overshirt, name: Stone Island overshirt/veste, match: ['stone island.*(veste|jacket|overshirt|surchemise|parka)'], resale: 170, new: 450}
      - {key: stone_sweat, name: Stone Island sweat/pull, match: ['stone island.*(sweat|pull|hoodie|crewneck)'], resale: 95, new: 250}
      - {key: stone_other, name: Stone Island (autre), match: ['stone island'], resale: 70, generic: true}
      - {key: cp_goggle, name: C.P. Company goggle, match: ['c ?p company.*goggle', 'goggle.*c ?p company'], resale: 180, new: 600}
      - {key: cp_other, name: C.P. Company (autre), match: ['c ?p company'], resale: 75, generic: true}
      - {key: carhartt_detroit, name: Carhartt Detroit jacket, match: ['carhartt.*detroit'], resale: 120}
      - {key: carhartt_jacket, name: Carhartt veste (Active/Michigan/Santa Fe), match: ['carhartt.*(active|michigan|santa fe|chore)'], resale: 85, new: 200, generic: true}
      - {key: rl_bear, name: Ralph Lauren Polo Bear, match: ['polo bear', 'ralph lauren.*bear'], resale: 110, new: 330}
      - {key: rl_qzip, name: Ralph Lauren quarter zip, match: ['ralph lauren.*(quarter|1/4|demi) ?zip'], resale: 45, new: 170, generic: true}
      - {key: burberry_trench, name: Burberry trench, match: ['burberry.*trench'], resale: 380, new: 2200}
