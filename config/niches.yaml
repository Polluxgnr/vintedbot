      - {key: levis_501_vintage, name: Levi's 501 vintage (made in USA), match: ['501.*(?:usa|vintage|big e)|levi.*(?:usa|big e)'], resale: 55}
      - {key: nike_tech, name: Nike Tech Fleece, match: ['tech fleece'], resale: 55, new: 120}
      - {key: supreme_bogo, name: Supreme Box Logo, match: ['supreme.*box ?logo|bogo'], resale: 180}
      - {key: stussy_hoodie, name: Stüssy sweat/hoodie, match: ['stussy.*(?:hoodie|sweat|crewneck)'], resale: 70}
      - {key: palace_triferg, name: Palace Tri-Ferg, match: ['palace.*(?:tri ?ferg|hoodie|sweat)'], resale: 90}
      - {key: carhartt_og_active, name: Carhartt WIP OG Active / Arctic, match: ['carhartt.*(?:og active|arctic)'], resale: 110}

  apple_tech:
    feed_catalogs: [3661, 3580, 3678]
    vinted_verification: electronics
    verification_min_price: 50
    required_specs: [storage]
    name: "Apple & tech"
    emoji: "🍏"
    description: "AirPods, iPad, MacBook, Apple Watch - les particuliers bradent, mais attention aux fakes et iCloud."
    enabled_by_default: true
    queries: [airpods pro 2, airpods max, airpods 4, ipad air, ipad pro, macbook air m1, macbook air m2, macbook pro m1,
              iphone 11, iphone 12, iphone 13 mini, iphone 14 pro max, iphone 15 pro max, iphone 16, iphone 16 pro,
              apple watch series, iphone 13, iphone 14, iphone 15]
    price_min: 25
    price_max: 900
    shipping_eur: 5
    min_profit: 30
    authenticity_risk: very_high
    collectible: false
    model_guard:
      - '^(?:coque|etui|housse|protection|verre|cable|chargeur|bracelet|support)\b'
      - '\b(?:compatible|pour airpods|pour iphone|pour ipad|for airpods|for iphone)\b'
    components: [{name: boîtier de charge, match: 'boitier|etui de charge', share: 0.5}, {name: un écouteur, match: 'ecouteurs?|airpods? (?:gauche|droit)', share: 0.45}, {name: chargeur/câble, match: 'chargeur|cables?', share: 0.04}, {name: boîte, match: 'boite', share: 0.04}, {name: bracelet, match: 'bracelet', share: 0.06}]
    alone: [{match: 'boitier seul|etui seul|ecouteur seul|airpods? (?:gauche|droit)(?: seul)?\b', missing: [un écouteur]}]
    exclude: ['^coque\b', '^etui\b', '^protection\b', '\bboite seule\b', '\bchargeur seul\b', '\bbracelet seul\b',
              '\bfactice\b', '\bcompatible\b', '\bpro max case\b', '\bverre trempe\b']
    red_flags: [AirPods "neufs scellés" très bas = fake quasi certain, pas de numéro de série, iCloud non mentionné, batterie < 80%, vendeur pressé / paiement hors Vinted]
    vision_checklist: [numéro de série visible, état écran et coins, santé batterie (capture), boîtier de charge et charnière, accessoires d'origine]
    ai_hints: "Les AirPods Pro 2 sont la cible n°1 des contrefaçons - un prix < 60% de la cote avec boîte scellée est suspect. Vérifie la mention iCloud déverrouillé pour iPhone/iPad/Mac."
    models:
      - {key: airpods_pro2, name: AirPods Pro 2, match: ['airpods? pro 2', 'airpods? pro (?:2e|2eme|second|usb ?c)'], resale: 140, new: 279}
      - {key: airpods_pro1, name: AirPods Pro (1re gen), match: ['airpods? pro\b'], exclude: ['pro 2', 'max'], resale: 75}
      - {key: airpods_max, name: AirPods Max, match: ['airpods? max'], resale: 330, new: 579}
      - {key: airpods4, name: AirPods 4, match: ['airpods? 4\b'], resale: 95, new: 149}
      - {key: ipad_air_m, name: iPad Air (M1/M2/M3), match: ['ipad air.*\bm[1-4]\b', 'ipad air (?:5|6|7)'], resale: 380, new: 719}
      - {key: ipad_pro_m, name: iPad Pro (M1+), match: ['ipad pro.*\bm[1-5]\b'], resale: 560, new: 1199}
      - {key: mba_m1, name: MacBook Air M1, match: ['macbook air.*\bm1\b'], resale: 450}
      - {key: mba_m2, name: MacBook Air M2/M3, match: ['macbook air.*\bm[23]\b'], resale: 650, new: 1199}
      - {key: mbp_m1, name: MacBook Pro M1/M2 Pro/Max, match: ['macbook pro.*\bm[1-3]\b'], resale: 800}
      - {key: iphone11, name: iPhone 11, match: ['iphone 11\b'], exclude: ['pro'], resale: 170}
      - {key: iphone11pro, name: iPhone 11 Pro / Pro Max, match: ['iphone 11 pro'], resale: 210}
      - {key: iphone12, name: iPhone 12, match: ['iphone 12\b'], exclude: ['pro', 'mini'], resale: 220}
      - {key: iphone12pro, name: iPhone 12 Pro / Pro Max, match: ['iphone 12 pro'], resale: 300}
      - {key: iphone13mini, name: iPhone 13 mini, match: ['iphone 13 mini'], resale: 260}
      - {key: iphone13, name: iPhone 13, match: ['iphone 13\b'], exclude: ['pro', 'mini'], resale: 280}
      - {key: iphone13pro, name: iPhone 13 Pro, match: ['iphone 13 pro'], resale: 380}
      - {key: iphone14, name: iPhone 14, match: ['iphone 14\b'], exclude: ['pro', 'plus'], resale: 360}
