# Reseller knowledge base.
#
# resale = typical price a "very good" item actually sells for on Vinted FR.
# These are SEED values: the engine blends them with prices it observes every
# day (comparables) and with AI estimates, so they self-correct over time.
# Tune them freely - every niche field can also be overridden per niche.
#
# Patterns (`match`, `exclude`) are regexes on normalized text:
# lowercase, no accents, punctuation -> space.

defaults:
  shipping_eur: 5.0
  resale_fee_pct: 0
  authenticity_risk: low

niches:

  sneakers:
    vinted_verification: authenticity
    verification_min_price: 100
    name: "Sneakers cotées"
    emoji: "👟"
    description: "Dunk, Jordan, New Balance, Asics, Salomon, Samba - liquides et faciles à revendre."
    enabled_by_default: true
    queries: [nike dunk low, jordan 1, new balance 550, new balance 2002r, new balance 9060, asics gel kayano 14,
              asics gel 1130, salomon xt-6, adidas samba og, adidas gazelle, onitsuka tiger mexico 66, nike air max 1]
    price_min: 15
    price_max: 160
    shipping_eur: 6.5
    min_profit: 20
    authenticity_risk: high
    collectible: true
    model_guard:
      - '\b(?:td|ps|gs|bebe|enfant|kids|junior|toddler|lacets?|semelles?|crep protect|keychain)\b'
    components: [{name: boîte d'origine, match: 'boite', share: 0.08}, {name: lacets, match: 'lacets?', share: 0.03}, {name: semelles, match: 'semelles?', share: 0.05}]
    alone: []
    exclude: ['\b(?:td|ps|gs|bebe|enfant|kids|toddler)\b', '\bsemelles?\b(?! .*inclu)', '\blacets?\b seul', '\bcustom\b']
    red_flags: [prix < 40% de la cote, photos de stock/catalogue, pas de photo de l'étiquette intérieure, boîte absente sur paire "neuve", vendeur 0 avis + paires multiples]
    vision_checklist: [étiquette intérieure (code style lisible), usure semelle et talon, plis du toe box, jaunissement, qualité des coutures et du swoosh/logo, boîte d'origine]
    ai_hints: "Les tailles 40-44 se revendent le mieux. Les coloris Panda/Chicago/Lost&Found/UNC sont les plus liquides. Méfie-toi des \"neuves sans boîte\"."
    models:
      - {key: dunk_panda, name: Nike Dunk Low Panda, match: ['dunk low.*(panda|black white|noir.*blanc|blanc.*noir)'], resale: 70, new: 120}
      - {key: dunk_low, name: Nike Dunk Low (autres coloris), match: ['\bdunk low\b'], resale: 75, new: 120, generic: true}
      - {key: jordan1_high, name: Air Jordan 1 High OG, match: ['jordan 1 (?:retro )?high', '\baj1 high\b'], resale: 120, new: 190}
      - {key: jordan1_mid, name: Air Jordan 1 Mid, match: ['jordan 1 mid'], resale: 60, new: 130}
      - {key: jordan1_low, name: Air Jordan 1 Low, match: ['jordan 1 low'], resale: 65, new: 120}
      - {key: jordan4, name: Air Jordan 4, match: ['jordan 4\b', '\baj4\b'], resale: 150, new: 220}
      - {key: nb550, name: New Balance 550, match: ['new balance 550', '\bnb ?550\b', '\bbb550'], resale: 60, new: 130}
      - {key: nb2002r, name: New Balance 2002R, match: ['2002r'], resale: 80, new: 160}
      - {key: nb9060, name: New Balance 9060, match: ['9060'], resale: 85, new: 170}
      - {key: nb990, name: New Balance 990 (v3-v6), match: ['\b990 ?v?[3-6]\b', 'm990'], resale: 120, new: 230}
      - {key: kayano14, name: Asics Gel-Kayano 14, match: ['kayano 14'], resale: 85, new: 160}
      - {key: gel1130, name: Asics Gel-1130, match: ['gel 1130'], resale: 60, new: 120}
      - {key: xt6, name: Salomon XT-6, match: ['xt ?6\b'], resale: 110, new: 200}
      - {key: samba, name: Adidas Samba OG, match: ['\bsamba\b'], resale: 60, new: 120}
      - {key: gazelle, name: Adidas Gazelle, match: ['\bgazelle\b'], resale: 50, new: 110}
      - {key: mexico66, name: Onitsuka Tiger Mexico 66, match: ['mexico 66'], resale: 60, new: 120}
      - {key: airmax1, name: Nike Air Max 1, match: ['air ?max 1\b'], resale: 70, new: 150}

  outdoor_premium:
